<mat-toolbar class="topbar">
  <a class="brand" routerLink="/">
    <mat-icon>storefront</mat-icon>
    <span>Commerce Prototype</span>
  </a>

  <nav>
    <a mat-button routerLink="/products" routerLinkActive="active-link">
      <mat-icon>inventory_2</mat-icon>
      Products
    </a>
    <a mat-button routerLink="/cart" routerLinkActive="active-link">
      <mat-icon>shopping_cart</mat-icon>
      Cart {{ cart.count() }}
    </a>
    @if (auth.isAuthenticated()) {
      <a mat-button routerLink="/orders" routerLinkActive="active-link">
        <mat-icon>receipt_long</mat-icon>
        Orders
      </a>
    }
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin" routerLinkActive="active-link">
        <mat-icon>admin_panel_settings</mat-icon>
        Admin
      </a>
    }
  </nav>

  <span class="spacer"></span>

  @if (auth.user(); as user) {
    <span class="identity">{{ user.email }}</span>
    <button mat-icon-button type="button" aria-label="Logout" (click)="auth.logout()">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <a mat-stroked-button routerLink="/login">Login</a>
    <a mat-flat-button routerLink="/register">Register</a>
  }
</mat-toolbar>

<router-outlet />
